<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Classroom Attendance</title>


  <!-- QR Code Library -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f5f7fb;

      color: #1f2937;

    }


    .container {

      width: 100%;

      max-width: 500px;

      background: white;

      border-radius: 20px;

      padding: 30px;

      box-shadow:
        0 10px 35px rgba(0,0,0,0.08);

    }


    h1 {

      text-align: center;

      margin: 0 0 10px;

    }


    .subtitle {

      text-align: center;

      color: #6b7280;

      margin-bottom: 25px;

      line-height: 1.5;

    }


    .field {

      margin-bottom: 16px;

    }


    label {

      display: block;

      font-weight: 600;

      margin-bottom: 7px;

    }


    input {

      width: 100%;

      padding: 13px;

      border: 1px solid #d1d5db;

      border-radius: 10px;

      font-size: 16px;

      outline: none;

    }


    input:focus {

      border-color: #2563eb;

    }


    button {

      width: 100%;

      border: none;

      border-radius: 10px;

      padding: 14px;

      background: #2563eb;

      color: white;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

    }


    button:disabled {

      background: #9ca3af;

      cursor: not-allowed;

    }


    .status {

      text-align: center;

      margin-top: 18px;

      font-weight: 600;

      line-height: 1.5;

    }


    #qrcode {

      display: flex;

      justify-content: center;

      margin-top: 25px;

    }


    .qr-url {

      margin-top: 20px;

      padding: 12px;

      background: #f3f4f6;

      border-radius: 10px;

      font-size: 13px;

      word-break: break-all;

    }


    .location-info {

      margin-top: 12px;

      text-align: center;

      font-size: 13px;

      color: #6b7280;

      line-height: 1.5;

    }


    .hidden {

      display: none !important;

    }

  </style>

</head>


<body>


<div class="container">


  <!-- ================================================= -->
  <!-- TEACHER VIEW -->
  <!-- ================================================= -->

  <div id="teacherView">


    <h1>
      Teacher Attendance
    </h1>


    <div class="subtitle">

      Enter the Google Sheet link to generate
      the attendance QR code.

    </div>


    <div class="field">

      <label for="sheetUrl">
        Google Sheet Link
      </label>


      <input
        type="text"
        id="sheetUrl"
        placeholder="Paste Google Sheet link"
        autocomplete="off"
      >

    </div>


    <button id="generateQR">

      Generate QR Code

    </button>


    <div
      id="teacherStatus"
      class="status">
    </div>


    <div id="qrcode"></div>


    <div
      id="qrUrl"
      class="qr-url hidden">
    </div>


  </div>



  <!-- ================================================= -->
  <!-- STUDENT VIEW -->
  <!-- ================================================= -->

  <div
    id="studentView"
    class="hidden">


    <h1>
      Classroom Attendance
    </h1>


    <div class="subtitle">

      Enter your information to mark attendance.

    </div>


    <form id="attendanceForm">


      <div class="field">

        <label for="studentId">
          Student ID
        </label>


        <input
          type="text"
          id="studentId"
          placeholder="Enter Student ID"
          autocomplete="off"
          required
        >

      </div>



      <div class="field">

        <label for="studentName">
          Full Name
        </label>


        <input
          type="text"
          id="studentName"
          placeholder="Enter Full Name"
          autocomplete="name"
          required
        >

      </div>



      <div class="field">

        <label for="studentGroup">
          Group Number
        </label>


        <input
          type="text"
          id="studentGroup"
          placeholder="Enter Group Number"
          autocomplete="off"
          required
        >

      </div>



      <button
        id="submitBtn"
        type="submit">

        Submit Attendance

      </button>


    </form>


    <div class="location-info">

      Your GPS location will be recorded with your attendance.

    </div>


    <div
      id="status"
      class="status">
    </div>


  </div>


</div>



<script>


// ============================================================
// CONFIGURATION
// ============================================================


// NEW GOOGLE APPS SCRIPT WEB APP

const CENTRAL_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxKkAoHIJxUJQbLh3VVYW8IQZTjBAfDg9XwEX-clz6eOacG3_iLacCg5CuqQqmojUfYqA/exec";


// NEW GOOGLE SHEET ID

const TARGET_SHEET_ID =
  "1q3cRSBwjVNN49CrT9cOS63Pf9i2ML8ldFxUgw3lg37s";


// ============================================================
// READ URL
// ============================================================

const urlParams =
  new URLSearchParams(
    window.location.search
  );


const sheetIdFromQR =
  urlParams.get("sheetId");


// ============================================================
// GET ELEMENTS
// ============================================================

const teacherView =
  document.getElementById(
    "teacherView"
  );


const studentView =
  document.getElementById(
    "studentView"
  );


// ============================================================
// CHOOSE PAGE
// ============================================================


// If there is NO sheetId
// show teacher page

if (!sheetIdFromQR) {

  teacherView.classList.remove(
    "hidden"
  );

}


// If there IS sheetId
// show student page

else {

  teacherView.classList.add(
    "hidden"
  );

  studentView.classList.remove(
    "hidden"
  );

}


// ============================================================
// TEACHER - GENERATE QR CODE
// ============================================================

const generateQRButton =
  document.getElementById(
    "generateQR"
  );


if (generateQRButton) {


  generateQRButton.addEventListener(
    "click",
    function () {


      const sheetUrl =
        document
          .getElementById("sheetUrl")
          .value
          .trim();


      const teacherStatus =
        document.getElementById(
          "teacherStatus"
        );


      const qrContainer =
        document.getElementById(
          "qrcode"
        );


      const qrUrl =
        document.getElementById(
          "qrUrl"
        );


      // ------------------------------------------
      // CHECK SHEET LINK
      // ------------------------------------------

      if (!sheetUrl) {

        teacherStatus.textContent =
          "Please paste the Google Sheet link.";

        teacherStatus.style.color =
          "red";

        return;

      }


      // ------------------------------------------
      // GET SHEET ID
      // ------------------------------------------

      const match =
        sheetUrl.match(
          /\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/
        );


      if (!match) {

        teacherStatus.textContent =
          "Invalid Google Sheet link.";

        teacherStatus.style.color =
          "red";

        return;

      }


      const enteredSheetId =
        match[1];


      // ------------------------------------------
      // CREATE STUDENT URL
      // ------------------------------------------

      const studentURL =
        window.location.origin +
        window.location.pathname +
        "?sheetId=" +
        encodeURIComponent(
          enteredSheetId
        );


      // ------------------------------------------
      // REMOVE OLD QR
      // ------------------------------------------

      qrContainer.innerHTML = "";


      // ------------------------------------------
      // GENERATE NEW QR
      // ------------------------------------------

      new QRCode(
        qrContainer,
        {

          text:
            studentURL,

          width:
            250,

          height:
            250

        }
      );


      teacherStatus.textContent =
        "QR code generated successfully.";

      teacherStatus.style.color =
        "green";


      // Show generated URL

      qrUrl.classList.remove(
        "hidden"
      );


      qrUrl.textContent =
        studentURL;


    }
  );

}


// ============================================================
// STUDENT - ATTENDANCE
// ============================================================

const attendanceForm =
  document.getElementById(
    "attendanceForm"
  );


if (attendanceForm) {


  attendanceForm.addEventListener(
    "submit",
    function (event) {


      event.preventDefault();


      // ------------------------------------------
      // GET FORM VALUES
      // ------------------------------------------

      const studentId =
        document
          .getElementById("studentId")
          .value
          .trim();


      const name =
        document
          .getElementById("studentName")
          .value
          .trim();


      const group =
        document
          .getElementById("studentGroup")
          .value
          .trim();


      const status =
        document.getElementById(
          "status"
        );


      const submitBtn =
        document.getElementById(
          "submitBtn"
        );


      // ------------------------------------------
      // VALIDATE
      // ------------------------------------------

      if (
        !studentId ||
        !name ||
        !group
      ) {

        status.textContent =
          "Please fill in all fields.";

        status.style.color =
          "red";

        return;

      }


      // ------------------------------------------
      // DISABLE BUTTON
      // ------------------------------------------

      submitBtn.disabled =
        true;


      submitBtn.textContent =
        "Getting location...";


      status.textContent =
        "Please allow location access.";

      status.style.color =
        "#555";


      // ------------------------------------------
      // CHECK GEOLOCATION
      // ------------------------------------------

      if (!navigator.geolocation) {

        status.textContent =
          "Geolocation is not supported on this device.";

        status.style.color =
          "red";


        submitBtn.disabled =
          false;


        submitBtn.textContent =
          "Submit Attendance";


        return;

      }


      // ------------------------------------------
      // GET LOCATION
      // ------------------------------------------

      navigator.geolocation.getCurrentPosition(

        function (position) {


          const latitude =
            position.coords.latitude;


          const longitude =
            position.coords.longitude;


          const accuracy =
            position.coords.accuracy;


          console.log(
            "GPS:",
            latitude,
            longitude,
            accuracy
          );


          // ----------------------------------------
          // CREATE DATA
          // ----------------------------------------

          const payload = {

            sheetId:
              TARGET_SHEET_ID,

            studentId:
              studentId,

            name:
              name,

            group:
              group,

            latitude:
              latitude,

            longitude:
              longitude,

            accuracy:
              accuracy

          };


          console.log(
            "Attendance payload:",
            payload
          );


          submitBtn.textContent =
            "Submitting...";


          status.textContent =
            "Sending attendance...";

          status.style.color =
            "#555";


          // ----------------------------------------
          // SEND TO APPS SCRIPT
          // ----------------------------------------

          fetch(
            CENTRAL_SCRIPT_URL,
            {

              method:
                "POST",

              mode:
                "no-cors",

              headers: {

                "Content-Type":
                  "application/x-www-form-urlencoded"

              },

              body:
                JSON.stringify(
                  payload
                )

            }
          )

          .then(
            function () {


              /*
                no-cors means the browser
                cannot read the response
                from Apps Script.

                The request itself has
                been sent successfully
                from the browser.
              */


              status.textContent =
                "Attendance submitted successfully!";

              status.style.color =
                "green";


              submitBtn.textContent =
                "Attendance Submitted";


              // Clear form

              document
                .getElementById(
                  "studentId"
                )
                .value = "";


              document
                .getElementById(
                  "studentName"
                )
                .value = "";


              document
                .getElementById(
                  "studentGroup"
                )
                .value = "";


            }
          )

          .catch(
            function (error) {


              console.error(
                "Attendance error:",
                error
              );


              status.textContent =
                "Could not submit attendance. Please try again.";

              status.style.color =
                "red";


              submitBtn.disabled =
                false;


              submitBtn.textContent =
                "Submit Attendance";


            }
          );


        },


        // ==========================================
        // GPS ERROR
        // ==========================================

        function (error) {


          console.error(
            "GPS error:",
            error
          );


          let message =
            "Could not get your location.";


          if (
            error.code === 1
          ) {

            message =
              "Location permission was denied.";

          }


          else if (
            error.code === 2
          ) {

            message =
              "Your location could not be determined.";

          }


          else if (
            error.code === 3
          ) {

            message =
              "Location request timed out.";

          }


          status.textContent =
            message;


          status.style.color =
            "red";


          submitBtn.disabled =
            false;


          submitBtn.textContent =
            "Submit Attendance";


        },


        // ==========================================
        // GPS SETTINGS
        // ==========================================

        {

          enableHighAccuracy:
            true,

          timeout:
            15000,

          maximumAge:
            0

        }

      );


    }
  );

}

</script>


</body>

</html>
