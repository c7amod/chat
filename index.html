<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Classroom Attendance</title>

  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5d9e0;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #4285f4;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #1a73e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #9aa0a6;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
      line-height: 1.5;
    }

    #teacherView,
    #studentView {
      display: none;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin-top: 25px;
    }

    .info {
      background: #f1f3f4;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      word-break: break-all;
      font-size: 14px;
    }

    .location {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- ========================= -->
    <!-- TEACHER VIEW -->
    <!-- ========================= -->

    <div id="teacherView">

      <h1>Classroom Attendance</h1>

      <div class="field">
        <label for="sheetUrl">
          Google Sheet Link
        </label>

        <input
          type="text"
          id="sheetUrl"
          placeholder="Paste Google Sheet link"
        >
      </div>

      <button id="generateQR">
        Generate Attendance QR
      </button>

      <div id="teacherStatus" class="status"></div>

      <div id="qrcode"></div>

      <div id="qrInfo" class="info" style="display:none;"></div>

    </div>


    <!-- ========================= -->
    <!-- STUDENT VIEW -->
    <!-- ========================= -->

    <div id="studentView">

      <h1>Classroom Attendance</h1>

      <form id="attendanceForm">

        <div class="field">
          <label for="studentId">
            Student ID
          </label>

          <input
            type="text"
            id="studentId"
            placeholder="Enter your Student ID"
            required
          >
        </div>


        <div class="field">
          <label for="studentName">
            Full Name
          </label>

          <input
            type="text"
            id="studentName"
            placeholder="Enter your full name"
            required
          >
        </div>


        <div class="field">
          <label for="studentGroup">
            Group Number
          </label>

          <input
            type="text"
            id="studentGroup"
            placeholder="Enter your group"
            required
          >
        </div>


        <button
          type="submit"
          id="submitBtn"
        >
          Submit Attendance
        </button>

      </form>


      <div class="location">
        Your location will be used to record GPS coordinates.
      </div>

      <div
        id="status"
        class="status"
      ></div>

    </div>

  </div>


<script>

  // ============================================================
  // CONFIGURATION
  // ============================================================

  // NEW Google Apps Script Web App
  const CENTRAL_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbw6b0LsRN3gOVVNpSnhhVq7DuArL7M0s6SIJL5gNAJswuPP0mxHV6jrzGdE8L9b-mpGbg/exec";


  // NEW Google Sheet ID
  const TARGET_SHEET_ID =
    "1q3cRSBwjVNN49CrT9cOS63Pf9i2ML8ldFxUgw3lg37s";


  // ============================================================
  // GET URL PARAMETERS
  // ============================================================

  const urlParams = new URLSearchParams(window.location.search);

  const sheetIdFromURL =
    urlParams.get("sheetId");


  // ============================================================
  // ELEMENTS
  // ============================================================

  const teacherView =
    document.getElementById("teacherView");

  const studentView =
    document.getElementById("studentView");


  // ============================================================
  // TEACHER / STUDENT MODE
  // ============================================================

  if (!sheetIdFromURL) {

    // No sheetId in URL
    // Show teacher view

    teacherView.style.display = "block";

  } else {

    // sheetId exists
    // Show student view

    studentView.style.display = "block";

  }


  // ============================================================
  // TEACHER: GENERATE QR CODE
  // ============================================================

  const generateQRButton =
    document.getElementById("generateQR");


  if (generateQRButton) {

    generateQRButton.addEventListener(
      "click",
      function () {

        const sheetUrl =
          document.getElementById("sheetUrl").value.trim();

        const teacherStatus =
          document.getElementById("teacherStatus");

        const qrContainer =
          document.getElementById("qrcode");

        const qrInfo =
          document.getElementById("qrInfo");


        // Check if link exists
        if (!sheetUrl) {

          teacherStatus.textContent =
            "Please paste the Google Sheet link.";

          teacherStatus.style.color = "red";

          return;
        }


        // Extract Google Sheet ID
        const match =
          sheetUrl.match(
            /\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/
          );


        if (!match) {

          teacherStatus.textContent =
            "Invalid Google Sheet link.";

          teacherStatus.style.color = "red";

          return;
        }


        const sheetId =
          match[1];


        // Build student URL
        const studentURL =
          window.location.origin +
          window.location.pathname +
          "?sheetId=" +
          encodeURIComponent(sheetId);


        // Clear previous QR
        qrContainer.innerHTML = "";


        // Generate QR
        new QRCode(
          qrContainer,
          {
            text: studentURL,
            width: 250,
            height: 250
          }
        );


        teacherStatus.textContent =
          "QR code generated successfully.";

        teacherStatus.style.color =
          "green";


        qrInfo.style.display =
          "block";

        qrInfo.textContent =
          studentURL;

      }
    );

  }


  // ============================================================
  // STUDENT ATTENDANCE
  // ============================================================

  const attendanceForm =
    document.getElementById("attendanceForm");


  if (attendanceForm) {

    attendanceForm.addEventListener(
      "submit",
      function (event) {

        event.preventDefault();


        const studentId =
          document.getElementById("studentId")
          .value
          .trim();


        const name =
          document.getElementById("studentName")
          .value
          .trim();


        const group =
          document.getElementById("studentGroup")
          .value
          .trim();


        const status =
          document.getElementById("status");


        const submitBtn =
          document.getElementById("submitBtn");


        // Basic validation
        if (!studentId || !name || !group) {

          status.textContent =
            "Please fill in all fields.";

          status.style.color =
            "red";

          return;
        }


        // Disable button
        submitBtn.disabled =
          true;

        submitBtn.textContent =
          "Getting location...";


        status.textContent =
          "Please allow location access.";

        status.style.color =
          "#555";


        // ======================================================
        // GET GPS LOCATION
        // ======================================================

        if (!navigator.geolocation) {

          status.textContent =
            "Geolocation is not supported by this device.";

          status.style.color =
            "red";

          submitBtn.disabled =
            false;

          submitBtn.textContent =
            "Submit Attendance";

          return;
        }


        navigator.geolocation.getCurrentPosition(

          function (position) {

            const latitude =
              position.coords.latitude;


            const longitude =
              position.coords.longitude;


            // ==================================================
            // CREATE PAYLOAD
            // ==================================================

            const payload = {

              sheetId:
                TARGET_SHEET_ID,

              studentId:
                studentId,

              name:
                name,

              group:
                group,

              latitude:
                latitude,

              longitude:
                longitude

            };


            // ==================================================
            // SEND TO GOOGLE APPS SCRIPT
            // ==================================================

            submitBtn.textContent =
              "Submitting...";


            status.textContent =
              "Sending attendance...";

            status.style.color =
              "#555";


            fetch(
              CENTRAL_SCRIPT_URL,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "text/plain;charset=utf-8"
                },

                body:
                  JSON.stringify(payload)
              }
            )

            .then(
              function (response) {

                return response.json();

              }
            )

            .then(
              function (result) {

                console.log(
                  "Apps Script response:",
                  result
                );


                if (result.success) {

                  status.textContent =
                    "Attendance marked successfully!";

                  status.style.color =
                    "green";


                  // Clear form
                  document.getElementById(
                    "studentId"
                  ).value = "";


                  document.getElementById(
                    "studentName"
                  ).value = "";


                  document.getElementById(
                    "studentGroup"
                  ).value = "";


                  submitBtn.textContent =
                    "Attendance Submitted";


                } else {

                  status.textContent =
                    result.message ||
                    "Attendance submission failed.";

                  status.style.color =
                    "red";


                  submitBtn.disabled =
                    false;

                  submitBtn.textContent =
                    "Submit Attendance";

                }

              }
            )

            .catch(
              function (error) {

                console.error(
                  "Attendance error:",
                  error
                );


                status.textContent =
                  "Could not submit attendance. Please try again.";

                status.style.color =
                  "red";


                submitBtn.disabled =
                  false;

                submitBtn.textContent =
                  "Submit Attendance";

              }
            );

          },


          // ==================================================
          // GPS ERROR
          // ==================================================

          function (error) {

            console.error(
              "GPS Error:",
              error
            );


            let message =
              "Could not get your location.";


            if (error.code === 1) {

              message =
                "Location permission was denied.";

            } else if (error.code === 2) {

              message =
                "Your location could not be determined.";

            } else if (error.code === 3) {

              message =
                "Location request timed out.";

            }


            status.textContent =
              message;

            status.style.color =
              "red";


            submitBtn.disabled =
              false;

            submitBtn.textContent =
              "Submit Attendance";

          },


          // ==================================================
          // GPS OPTIONS
          // ==================================================

          {
            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 0
          }

        );

      }
    );

  }

</script>

</body>
</html>
