<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Attendance</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      padding: 20px;
      max-width: 480px;
      margin: auto;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .instructions {
      background: #e8f0fe;
      border-left: 4px solid #1a73e8;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.5;
      border-radius: 0 4px 4px 0;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="card">

  <div id="studentView">

    <h2 style="margin-top:0;">Attendance</h2>

    <div class="field">
      <label>Student ID:</label>
      <input
        type="text"
        id="studentId"
        placeholder="e.g., 20241089"
        required
      >
    </div>

    <div class="field">
      <label>Full Name:</label>
      <input
        type="text"
        id="studentName"
        placeholder="e.g., Alex Johnson"
        required
      >
    </div>

    <div class="field">
      <label>Group Number:</label>
      <input
        type="text"
        id="studentGroup"
        placeholder="e.g., Group 3 or Section B"
        required
      >
    </div>

    <button id="submitBtn" onclick="submitAttendance()">
      Submit Attendance
    </button>

    <div id="status"></div>

  </div>

</div>

<script>

  // Google Apps Script Web App
  const CENTRAL_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzogi-8Ew4FkxT6eEYLNS3KRFnUwhbBnPbRPbTCIZR8CRga4QKZBvtxoABNSac6djuKfg/exec";


  // NEW GOOGLE SHEET ID
  const TARGET_SHEET_ID =
    "1q3cRSBwjVNN49CrT9cOS63Pf9i2ML8ldFxUgw3lg37s";


  function submitAttendance() {

    const status = document.getElementById("status");

    const studentId =
      document.getElementById("studentId").value.trim();

    const name =
      document.getElementById("studentName").value.trim();

    const group =
      document.getElementById("studentGroup").value.trim();


    // Check fields
    if (!studentId || !name || !group) {

      status.textContent =
        "Please fill in all fields.";

      status.style.color = "red";

      return;
    }


    // Request GPS
    status.textContent =
      "Recording GPS location...";

    status.style.color = "#444";


    navigator.geolocation.getCurrentPosition(

      (pos) => {

        status.textContent =
          "Submitting attendance...";


        const payload = JSON.stringify({

          sheetId: TARGET_SHEET_ID,

          studentId: studentId,

          name: name,

          group: group,

          latitude: pos.coords.latitude,

          longitude: pos.coords.longitude

        });


        fetch(CENTRAL_SCRIPT_URL, {

          method: "POST",

          mode: "no-cors",

          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },

          body: payload

        })

        .then(() => {

          status.textContent =
            "Attendance marked successfully!";

          status.style.color = "green";


          document.getElementById("studentId").value = "";

          document.getElementById("studentName").value = "";

          document.getElementById("studentGroup").value = "";


          document.getElementById("submitBtn").disabled = true;

        })

        .catch(() => {

          status.textContent =
            "Submission failed. Please check connection and retry.";

          status.style.color = "red";

        });

      },


      (err) => {

        status.textContent =
          "Location permission is required to submit. Please allow GPS.";

        status.style.color = "red";

      },


      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }

    );

  }

</script>

</body>
</html>
